[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron"
version = "1.0.0"
description = "NEUTRON - Raspberry Pi 4 Personal Assistant Robot with 7-Layer Emotional Cognition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "NEUTRON Team", email = "neutron@example.com"}
]
keywords = [
    "raspberry-pi",
    "personal-assistant",
    "emotional-ai",
    "voice-assistant",
    "robotics",
    "cognitive-architecture"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Home Automation",
]
dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # AI Providers
    "google-generativeai>=0.3.2",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    
    # Voice Pipeline
    "vosk>=0.3.45",
    "piper-tts>=1.2.0",
    "openwakeword>=0.5.1",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "webrtcvad>=2.0.10",
    
    # Memory & Storage
    "aiosqlite>=0.19.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",
    
    # Vision & Face Detection
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.9",
    
    # Cloud Sync
    "google-cloud-storage>=2.14.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "cachetools>=5.3.2",
    "aiofiles>=23.2.1",
    "orjson>=3.9.10",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
]
hardware = [
    "RPi.GPIO>=0.7.1",
    "pigpio>=1.78",
    "adafruit-circuitpython-servokit>=1.3.15",
]

[project.scripts]
neutron = "neutron.__main__:main"
neutron-server = "server.main:run"

[project.urls]
Homepage = "https://github.com/neutron-ai/neutron"
Documentation = "https://neutron-ai.github.io/docs"
Repository = "https://github.com/neutron-ai/neutron"

[tool.setuptools.packages.find]
where = ["."]
include = ["neutron*", "config*", "cortex*", "ai*", "speech*", "memory*", "server*", "hardware*", "utils*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
]

[tool.ruff.isort]
known-first-party = ["neutron", "config", "cortex", "ai", "speech", "memory", "server", "hardware", "utils"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "vosk.*",
    "piper.*",
    "openwakeword.*",
    "sounddevice.*",
    "webrtcvad.*",
    "chromadb.*",
    "google.cloud.*",
    "google.generativeai.*",
    "pigpio.*",
    "RPi.*",
    "adafruit_servokit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "hardware: marks tests requiring hardware",
]

[tool.coverage.run]
source = ["neutron", "cortex", "ai", "speech", "memory", "server"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
